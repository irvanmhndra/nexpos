<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nexpos - Dashboard Manajemen Bisnis" />
    <title>Nexpos Dashboard</title>
  </head>
  <body>
    <style>
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #f8fafc;
      }
      #root:empty::after {
        content: '';
        width: 36px;
        height: 36px;
        border: 3px solid #e2e8f0;
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: _spin 0.65s linear infinite;
      }
      @media (prefers-color-scheme: dark) {
        #root:empty { background: #0f172a; }
        #root:empty::after { border-color: #1e293b; border-top-color: #3b82f6; }
      }
      @keyframes _spin { to { transform: rotate(360deg); } }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
