name: Deploy nexpos-api

on:
  push:
    branches: [master]

jobs:
  lint:
    name: "Lint: golangci-lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.3
          args: --timeout=5m

  test:
    name: "Test: Unit & Integration"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'

      - name: Run all tests with coverage
        run: go test -v -race -timeout 120s -coverprofile=coverage.out -covermode=atomic -coverpkg=./internal/... ./...

      - name: Check coverage >= 50%
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep "^total:" | awk '{print $3}' | tr -d '%')
          echo "Combined coverage: ${COVERAGE}%"
          awk -v cov="$COVERAGE" 'BEGIN {
            if (cov+0 < 50) {
              print "Coverage " cov "% is below 50% minimum"; exit 1
            }
            print "Coverage " cov "% meets 50% minimum"
          }'

  vulnerability-scan:
    name: "Security: govulncheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  static-analysis:
    name: "Security: Static Analysis (gosec)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'

      - name: Run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec ./...

  deploy:
    name: "Deploy"
    needs: [lint, test, vulnerability-scan, static-analysis]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Login to GHCR
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | \
            docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build & push image
        run: |
          docker build -t ghcr.io/irvanmhndra/nexpos-api:latest .
          docker push ghcr.io/irvanmhndra/nexpos-api:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/nexpos
            docker compose up -d mongo
            docker compose pull nexpos-api
            docker compose up -d nexpos-api
            docker image prune -f
            echo "✅ API deployed: $(date)"

      - name: Run Migrations
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sleep 5
            docker exec nexpos_api sh -c '/app/migrate -path /app/migrations -database "postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB?sslmode=$POSTGRES_SSLMODE" up'
            echo "✅ Migrations applied: $(date)"
