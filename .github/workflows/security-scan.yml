name: Security scan

# A new CVE fails govulncheck on the next deploy, whatever that deploy was for.
# This finds it on Monday morning instead, with nothing waiting behind it.
on:
  schedule:
    - cron: "0 1 * * 1" # Mondays 08:00 WIB
  workflow_dispatch:

jobs:
  govulncheck:
    name: "Go: govulncheck"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  cargo-audit:
    name: "Rust: cargo audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
        working-directory: backend

  npm-audit:
    name: "Frontend: npm audit"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm audit --omit=dev --audit-level=high
