name: Deploy nexpos

on:
  push:
    branches: [main]

# One deploy at a time; a newer push waits instead of racing the running one.
concurrency:
  group: deploy-nexpos
  cancel-in-progress: false

jobs:
  changes:
    name: "Detect changes"
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - 'backend-go/**'
              - '.github/workflows/deploy.yml'
            rust:
              - 'backend/**'
              - 'backend-go/tests/**'
              - '.github/workflows/deploy.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/deploy.yml'

  # ==================== Backend ====================

  go-lint:
    name: "Go: golangci-lint"
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: backend-go/go.sum
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.3
          working-directory: backend-go
          args: --timeout=5m

  go-test:
    name: "Go: unit & integration"
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: backend-go/go.sum
      - name: Run all tests with coverage
        run: go test -v -race -timeout 120s -coverprofile=coverage.out -covermode=atomic -coverpkg=./internal/... ./...
      - name: Check coverage >= 50%
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep "^total:" | awk '{print $3}' | tr -d '%')
          echo "Combined coverage: ${COVERAGE}%"
          awk -v cov="$COVERAGE" 'BEGIN {
            if (cov+0 < 50) {
              print "Coverage " cov "% is below 50% minimum"; exit 1
            }
            print "Coverage " cov "% meets 50% minimum"
          }'

  go-vulncheck:
    name: "Go: govulncheck"
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: backend-go/go.sum
      - run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  go-gosec:
    name: "Go: gosec"
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: backend-go/go.sum
      - run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec ./...

  go-deploy:
    name: "Go: deploy"
    needs: [go-lint, go-test, go-vulncheck, go-gosec]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Login to GHCR
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | \
            docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build & push image
        run: |
          docker build -t ghcr.io/irvanmhndra/nexpos-api:latest backend-go
          docker push ghcr.io/irvanmhndra/nexpos-api:latest

      # Ship the compose file from the repo → the server, so the repo stays the
      # single source of truth. It only copies the compose file — never .env.
      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "backend-go/docker-compose.prod.yml"
          strip_components: 1
          target: "~/nexpos"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Migrate with the NEW image before switching to it, so no request hits
          # code that expects a schema the database doesn't have yet.
          # set -e: if the migration fails, the old container keeps serving.
          script: |
            set -e
            cd ~/nexpos
            cp docker-compose.prod.yml docker-compose.yml
            docker compose pull nexpos-api
            docker compose run --rm nexpos-api sh -c '/app/migrate -path /app/migrations -database "postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB?sslmode=$POSTGRES_SSLMODE" up'
            echo "✅ Migrations applied: $(date)"
            docker compose up -d --remove-orphans
            docker image prune -af
            echo "✅ Stack deployed: $(date)"

  # ==================== Rust API (backend/) ====================
  # Not deployed yet. It must stay wire-compatible with the Go API: the
  # conformance job runs the Go integration suite (tests listed in
  # backend/conformance-tests.txt) against the Rust server.

  rust-check:
    name: "Rust: fmt, clippy, test"
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nexpos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/nexpos
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  rust-conformance:
    name: "Rust: conformance with the Go suite"
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nexpos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: backend-go/go.sum
      # Routes Rust doesn't serve yet go to the Go API, like in production.
      - name: Start the Go API on :8080
        working-directory: backend-go
        env:
          SERVER_PORT: "8080"
          SERVER_ENV: test
          POSTGRES_HOST: localhost
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nexpos
          JWT_SECRET: conformance-secret
        run: |
          go build -o /tmp/nexpos-go ./cmd/api
          nohup /tmp/nexpos-go > /tmp/go.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8080/health/live && exit 0; sleep 1; done
          cat /tmp/go.log; exit 1
      - name: Build the Rust server
        working-directory: backend
        run: cargo build --release --bin nexpos-server
      - name: Start it on :8090
        working-directory: backend
        env:
          SERVER_PORT: "8090"
          POSTGRES_HOST: localhost
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nexpos
          GO_UPSTREAM_URL: http://127.0.0.1:8080
        run: |
          nohup ./target/release/nexpos-server > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8090/health/live && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: Run the Go suite against it
        working-directory: backend-go
        env:
          TARGET_BASE_URL: http://127.0.0.1:8090
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/nexpos?sslmode=disable
        run: go test -count=1 -p 1 -v -run "$(paste -sd'|' ../backend/conformance-tests.txt)" ./tests/integration/
      - name: Server logs
        if: failure()
        run: cat backend/server.log /tmp/go.log

  rust-image:
    name: "Rust: Docker image builds"
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t nexpos-rust:ci backend

  # ==================== Frontend ====================

  # Waits for the backend so a push that changes both never ships a frontend
  # against an API that isn't deployed yet. Skipped if any backend job failed.
  frontend-deploy:
    name: "Frontend: build & deploy"
    needs: [changes, go-lint, go-test, go-vulncheck, go-gosec, go-deploy]
    if: >-
      always() &&
      needs.changes.outputs.frontend == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

      - name: Deploy to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: frontend/dist/
          strip_components: 2
          target: /var/www/nexpos-web/
