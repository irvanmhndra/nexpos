name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  changes:
    name: "Detect changes"
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/pr-check.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/pr-check.yml'

  backend-lint:
    name: "Backend: golangci-lint"
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: backend/go.sum
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.3
          working-directory: backend
          args: --timeout=5m

  backend-test:
    name: "Backend: unit & integration"
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: backend/go.sum
      - run: go test -v -race -short ./internal/...
      - run: go test -v -race ./tests/integration/...
      - run: CGO_ENABLED=0 GOOS=linux go build -o bin/api ./cmd/api

  backend-security:
    name: "Backend: govulncheck & gosec"
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: backend/go.sum
      - run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec ./...

  frontend-build:
    name: "Frontend: build"
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # TODO: add `npm run lint` once the 3 existing eslint errors are fixed
      # (set-state-in-effect in two detail pages, an unused var in the PO form).
      - run: npm run build
